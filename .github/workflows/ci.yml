name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "40 4 * * 1" # weekly rebuild: fresh Wolfi base and Node/Nginx packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The pinned Wolfi digest must carry Chainguard's keyless signature before anything builds on
  # it. Identity and issuer are the ones Chainguard documents for its public images (the
  # "Provenance" tab of https://images.chainguard.dev/directory/image/wolfi-base).
  verify-base:
    name: verify base image signature
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Verify the pinned base digest
        run: |
          set -euo pipefail
          refs="$(grep -ohE 'cgr\.dev/chainguard/wolfi-base:[^@" ]+@sha256:[a-f0-9]{64}' Dockerfile | sort -u)"
          [ -n "$refs" ] || { echo "no pinned wolfi-base reference found in the Dockerfile" >&2; exit 1; }
          while read -r ref; do
            echo "verifying ${ref%%:*}@${ref##*@}"
            for attempt in 1 2 3; do
              cosign verify "${ref%%:*}@${ref##*@}" \
                --certificate-identity-regexp '^https://github\.com/chainguard-images/images/\.github/workflows/release\.yaml@refs/heads/main$' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null && break
              [ "$attempt" -lt 3 ] || exit 1
              sleep $((attempt * 10))
            done
          done <<<"$refs"

  build:
    name: build ${{ matrix.target }} ${{ matrix.node }}
    needs: verify-base
    strategy:
      fail-fast: false
      matrix:
        # Three Node majors x two targets. The newest major also carries the
        # unversioned `latest` / `builder` tags.
        include:
          - node: "22"
            target: runtime
            suffix: ""
            title: nginx-nodejs
            description: Rootless Node.js runtime behind Nginx — static files, Brotli/gzip, caching, s6 supervision and sanitized logs with optional Loki delivery.
            tags: |
              type=raw,value=22
          - node: "24"
            target: runtime
            suffix: ""
            title: nginx-nodejs
            description: Rootless Node.js runtime behind Nginx — static files, Brotli/gzip, caching, s6 supervision and sanitized logs with optional Loki delivery.
            tags: |
              type=raw,value=24
          - node: "26"
            target: runtime
            suffix: ""
            title: nginx-nodejs
            description: Rootless Node.js runtime behind Nginx — static files, Brotli/gzip, caching, s6 supervision and sanitized logs with optional Loki delivery.
            tags: |
              type=raw,value=26
              type=raw,value=latest
          - node: "22"
            target: builder
            suffix: "-builder"
            title: nginx-nodejs builder
            description: Node.js and npm build stage matching the nginx-nodejs runtime, for multi-stage application builds.
            tags: |
              type=raw,value=22-builder
          - node: "24"
            target: builder
            suffix: "-builder"
            title: nginx-nodejs builder
            description: Node.js and npm build stage matching the nginx-nodejs runtime, for multi-stage application builds.
            tags: |
              type=raw,value=24-builder
          - node: "26"
            target: builder
            suffix: "-builder"
            title: nginx-nodejs builder
            description: Node.js and npm build stage matching the nginx-nodejs runtime, for multi-stage application builds.
            tags: |
              type=raw,value=26-builder
              type=raw,value=builder
    uses: vdementev/docker-workflows/.github/workflows/build-image.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      namespace: lotuswebagency
      image: nginx-nodejs
      # Docker Hub credentials are secrets of the `release` environment, which
      # only `main` may enter; the job enters it only when it publishes, so
      # pull requests never see them.
      environment: release
      target: ${{ matrix.target }}
      build-args: NODE_MAJOR=${{ matrix.node }}
      cache-scope: ${{ matrix.target }}-${{ matrix.node }}
      push: ${{ github.event_name != 'pull_request' }}
      # Fluent Bit and the Brotli modules compile from source; arm64 waits until
      # it is verified natively rather than under QEMU.
      platforms: linux/amd64
      timeout-minutes: 90
      # Every Wolfi package floats, so also fail on anything in CISA's KEV catalog (fixable or
      # not) and on AGPL licenses, beyond the shared fixable CRITICAL/HIGH gate.
      kev-gate: true
      license-gate: true
      tags: ${{ matrix.tags }}
      # Runtime: routing, caching, compression, log privacy, Loki delivery,
      # supervision and config validation. Builder: node + npm, UID 1000.
      # $IMAGE is set by the reusable workflow.
      test-command: NODE_MAJOR=${{ matrix.node }} TARGET=${{ matrix.target }} ./tests.sh
      # Node is an unpinned Wolfi package (one per major), so the version tags are read back
      # out of the image that just passed the tests: 26.12.1 and 26.12 (plus
      # the -builder suffix for the builder).
      version-command: docker run --rm --network none --entrypoint node "$IMAGE" -p process.versions.node
      version-tag-suffix: ${{ matrix.suffix }}
      labels: |
        org.opencontainers.image.title=${{ matrix.title }}
        org.opencontainers.image.description=${{ matrix.description }}
        org.opencontainers.image.url=https://hub.docker.com/r/lotuswebagency/nginx-nodejs
        org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.vendor=Lotus Web Agency
        org.opencontainers.image.authors=Vasilii Dementev https://vasiliidementev.com
        org.opencontainers.image.licenses=MIT
    # Environment secrets resolve in the called job only when the caller inherits secrets
    # (actions/runner#4453). The repo holds no other secrets, and pull-request runs never
    # enter `release`, so they still see none.
    secrets: inherit

  sync-description:
    if: github.event_name != 'pull_request'
    needs: build
    uses: vdementev/docker-workflows/.github/workflows/sync-description.yml@v1
    with:
      namespace: lotuswebagency
      image: nginx-nodejs
      environment: release
      short-description: "Rootless Node.js + Nginx runtime: Brotli/gzip statics, caching, s6 supervision, logs to Loki."
    secrets: inherit
