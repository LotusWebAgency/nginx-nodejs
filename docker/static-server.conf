# Resolve ranges and conditional responses before the public server adds headers.
server {
    listen 127.0.0.1:8081;
    root __STATIC_ROOT__;
    access_log off;
    absolute_redirect off;
    gzip off;
    brotli off;
    brotli_static on;
    gzip_static on;
    location = /__container_health { return 200; }
    location / { try_files $uri $uri/index.html =404; }
}
