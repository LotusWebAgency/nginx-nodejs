location ~ (?:^|/)(?:\.[^/]*|dist|src|node_modules|cache)(?:/|$) { return 404; }
location ~* \.map(?:/|$) { return 404; }
location ~ ^/assets/ {
    try_files $uri =404;
    include /etc/nginx-nodejs/static-proxy.conf;
}
location ~ "\.[a-zA-Z0-9]{1,8}$" {
    try_files $uri @node;
    include /etc/nginx-nodejs/static-proxy.conf;
}
location / {
    try_files $uri $uri/index.html @node;
    include /etc/nginx-nodejs/static-proxy.conf;
}
location @node { include /run/nginx-nodejs/proxy.conf; }
