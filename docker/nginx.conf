load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;
worker_processes __WORKER_PROCESSES__;
worker_rlimit_nofile __WORKER_RLIMIT_NOFILE__;
pcre_jit on;
pid /run/nginx-nodejs/nginx.pid;
error_log stderr error;
events { worker_connections __WORKER_CONNECTIONS__; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=1024 inactive=30s;
    open_file_cache_valid 10s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    client_body_temp_path /run/nginx-nodejs/client_temp;
    proxy_temp_path /run/nginx-nodejs/proxy_temp;
    fastcgi_temp_path /run/nginx-nodejs/fastcgi_temp;
    uwsgi_temp_path /run/nginx-nodejs/uwsgi_temp;
    scgi_temp_path /run/nginx-nodejs/scgi_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
    map $request_method $safe_method { default OTHER; GET GET; HEAD HEAD; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE; OPTIONS OPTIONS; }
    map $upstream_http_x_request_id $correlation_id { '' $request_id; default $upstream_http_x_request_id; }
    map $uri $static_cache_control {
        default "public, max-age=0";
        ~^/assets/ "public, max-age=31536000, immutable";
    }
    map "$upstream_status:$upstream_http_cache_control" $upstream_cache_control {
        default $upstream_http_cache_control;
        ~^[^:]+:$ no-store;
    }
    map $upstream_addr $content_cache_control {
        '' $static_cache_control;
        default $upstream_cache_control;
    }
    map $status $response_cache_control { volatile; default $content_cache_control; ~^[45] no-store; }
    log_format safe escape=json '{"timestamp":"$time_iso8601","service":"__LOG_SERVICE__","event":"nginx_request","requestId":"$correlation_id","method":"$safe_method","status":$status,"durationSeconds":$request_time}';
    access_log syslog:server=127.0.0.1:5514,tag=nginx,nohostname safe;
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml;
    brotli on;
    brotli_min_length 512;
    brotli_comp_level 4;
    brotli_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml;
    # Keep the idle timeout below Node's default 5 s keepAliveTimeout so Nginx never reuses a socket Node is closing.
    upstream node_app {
        server 127.0.0.1:__NODE_PORT__;
        keepalive 32;
        keepalive_timeout 4s;
    }
    server {
        listen 8080;
        absolute_redirect off;
        root __STATIC_ROOT__;
        brotli_static on;
        gzip_static on;
        include /run/nginx-nodejs/ingress.conf;
        client_max_body_size 51m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Request-ID $correlation_id always;
        add_header Cache-Control $response_cache_control always;
        if ($uri ~* "\\.(?:br|gz)(?:/|$)") { return 404; }
        location = /__container_health {
            if ($remote_addr != 127.0.0.1) { return 404; }
            access_log off;
            return 200;
        }
        include /run/nginx-nodejs/routes.conf;
    }
}
